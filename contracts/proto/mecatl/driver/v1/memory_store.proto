// mecatl driver API: the remote memory-store protocol.
//
// MemoryStoreService is the wire seam behind the harness's `tool.MemoryStore`
// (engine/tool/tool.go): an operator-run driver process holds the
// cross-session ("tiered") memory entries in place of the in-process flock
// store (internal/adapter/memory). The driver sits at the SAME trust tier as
// an on-disk memory directory — operator-configured infrastructure, not a
// model-facing surface. Sanitization of model-written values stays
// HARNESS-SIDE (the memory tools); a driver is never trusted to sanitize.
//
// The six RPCs mirror the tool.MemoryStore interface one-for-one. Behavioral
// contract (pinned by the engine/adapter/memconformance suite, which remote
// drivers run over their client):
//   - RememberEntry overwrites by key and bumps updated_at; a blank or
//     whitespace-only key is INVALID_ARGUMENT.
//   - Recall of a missing key is found=false — NEVER NOT_FOUND.
//   - List/Index results are key-sorted; Search is best-first and
//     deterministic for identical store state and query.
//   - Index/Search results OMIT values (the tier-0 routing table); List and
//     Recall return them.
//   - Forget of a missing key succeeds (idempotent).
//
// Validation: required-field annotations are authored with `buf.validate.field`
// for documentation and future runtime enforcement; V1 enforces them in the Go
// client/server wrappers (internal/adapter/grpcdriver).

syntax = "proto3";

package mecatl.driver.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// MemoryStoreService holds cross-session memory entries keyed by an opaque
// string key. It is the remote analogue of tool.MemoryStore's six methods.
service MemoryStoreService {
  // RememberEntry stores the entry, overwriting any existing entry under the
  // same key and bumping its updated_at. A blank or whitespace-only key is
  // INVALID_ARGUMENT.
  rpc RememberEntry(RememberEntryRequest) returns (RememberEntryResponse);

  // Recall returns the entry for the exact key. A miss is found=false with an
  // unset entry — NEVER NOT_FOUND.
  rpc Recall(RecallRequest) returns (RecallResponse);

  // List returns all entries whose key has the given prefix, key-sorted, with
  // values PRESENT. An empty prefix returns every entry.
  rpc List(ListRequest) returns (ListResponse);

  // Forget deletes the entry for the key. Deleting a missing key succeeds
  // (idempotent).
  rpc Forget(ForgetRequest) returns (ForgetResponse);

  // Index returns the tier-0 routing table: every entry key-sorted with the
  // value OMITTED and description filled (explicit, else derived from the
  // value's first non-empty line).
  rpc Index(IndexRequest) returns (IndexResponse);

  // Search returns up to k entries relevant to the query, best-first and
  // deterministic, with values OMITTED. A blank query yields an empty result,
  // not an error; k <= 0 selects the driver's default page size.
  rpc Search(SearchRequest) returns (SearchResponse);
}

// MemoryEntry is one cross-session memory record, mirroring tool.MemoryEntry.
message MemoryEntry {
  // key is the opaque lookup key (e.g. "pref/test-runner").
  string key = 1;

  // value is the stored text. It MUST be present in List and Recall results
  // and EMPTY in Index and Search results (which omit values by design).
  string value = 2;

  // description is the optional one-line tier-0 index hook. Index results
  // always carry one (explicit, else derived from the value's first non-empty
  // line).
  string description = 3;

  // updated_at is the wall-clock time the entry was last written. It is
  // stamped by the DRIVER on write; on input (RememberEntry) it is advisory
  // and may be ignored.
  google.protobuf.Timestamp updated_at = 4;
}

// RememberEntryRequest carries the entry to store.
message RememberEntryRequest {
  // entry is the record to store; entry.key blank/whitespace-only is
  // INVALID_ARGUMENT.
  MemoryEntry entry = 1 [(buf.validate.field).required = true];
}

// RememberEntryResponse is empty: a successful write has no payload.
message RememberEntryResponse {}

// RecallRequest asks for the entry under an exact key.
message RecallRequest {
  // key is the exact key to look up.
  string key = 1;
}

// RecallResponse reports the lookup outcome. A miss is found=false with entry
// unset — never a NOT_FOUND error.
message RecallResponse {
  // entry is the found record (value present); unset on a miss.
  MemoryEntry entry = 1;

  // found reports whether an entry exists under the key.
  bool found = 2;
}

// ListRequest selects entries by key prefix.
message ListRequest {
  // prefix filters entries to those whose key starts with it; empty selects
  // every entry.
  string prefix = 1;
}

// ListResponse carries the matching entries, key-sorted, values present.
message ListResponse {
  // entries are the matching records in key order, values PRESENT.
  repeated MemoryEntry entries = 1;
}

// ForgetRequest names the key to delete.
message ForgetRequest {
  // key is the entry to delete; a missing key is not an error.
  string key = 1;
}

// ForgetResponse is empty: Forget is idempotent and has no payload.
message ForgetResponse {}

// IndexRequest is empty: Index always returns the full routing table.
message IndexRequest {}

// IndexResponse carries the tier-0 routing table.
message IndexResponse {
  // entries are every record key-sorted, values OMITTED, descriptions filled.
  repeated MemoryEntry entries = 1;
}

// SearchRequest is a relevance query over the stored entries.
message SearchRequest {
  // query is the free-text query; blank/whitespace-only yields an empty
  // result, not an error.
  string query = 1;

  // k caps the number of results; k <= 0 selects the driver's default page
  // size.
  int32 k = 2;
}

// SearchResponse carries the best-first matches.
message SearchResponse {
  // entries are the matches best-first (deterministic for identical store
  // state and query), values OMITTED.
  repeated MemoryEntry entries = 1;
}
