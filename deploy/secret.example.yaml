# EXAMPLE Secret holding the OpenAI API key ozzd reads from OPENAI_API_KEY.
#
# DO NOT COMMIT A REAL KEY. This file is an illustrative placeholder. In a real
# cluster, create the Secret out-of-band (kubectl/sops/SealedSecret) or source it
# from a secrets manager via an ExternalSecret (placeholder below) — and do NOT
# include this example in the kustomization.yaml apply set.
#
#   kubectl create secret generic ozzd-openai \
#     --from-literal=OPENAI_API_KEY="sk-...your-key..."
#
apiVersion: v1
kind: Secret
metadata:
  name: ozzd-openai
  labels:
    app.kubernetes.io/name: ozzharness
    app.kubernetes.io/component: ozzd
type: Opaque
stringData:
  # Replace with your key out-of-band; never commit a real value.
  OPENAI_API_KEY: "REPLACE_ME"
---
# ALTERNATIVE: ExternalSecret placeholder (External Secrets Operator). Pulls the
# key from a backing secrets manager (Vault, AWS/GCP SM, …) into the same
# `ozzd-openai` Secret the Deployment references. Requires ESO + a configured
# SecretStore; left commented as a template.
