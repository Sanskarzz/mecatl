# Deployment for ozzd, the ozzharness server.
#
# The image field is the ko placeholder `ko://<import-path>`; `ko resolve`
# (or `ko apply`) replaces it with the built+pushed image ref. The Pod follows
# the Pod Security Standards "restricted" profile in full.
#
# SECURITY: the ozzd API is UNAUTHENTICATED — it exposes command/file execution
# with no caller identity check. Inside the pod we bind 0.0.0.0 (the pod netns is
# isolated); reachability is gated entirely by the Service and (recommended) a
# NetworkPolicy. Deploy only inside a trusted network / behind external auth.
# See deploy/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ozzd
  labels:
    app.kubernetes.io/name: ozzharness
    app.kubernetes.io/component: ozzd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ozzharness
      app.kubernetes.io/component: ozzd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ozzharness
        app.kubernetes.io/component: ozzd
    spec:
      # Pod-level securityContext. UID/GID 65532 matches the nonroot user baked
      # into the chainguard static base image (.ko.yaml). fsGroup makes any
      # mounted Secret readable by the process.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ozzd
          # ko substitutes this placeholder with the built image ref on
          # `ko resolve` / `ko apply`.
          image: ko://github.com/stacklok/ozzharness/cmd/ozzd
          args:
            # Bind 0.0.0.0 inside the pod (the in-code default is loopback).
            - --grpc-addr=0.0.0.0:8080
            - --http-addr=0.0.0.0:8081
            # Use the real OpenAI Responses provider; key comes from the Secret.
            - --openai
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ozzd-openai
                  key: OPENAI_API_KEY
          ports:
            - name: grpc
              containerPort: 8080
            - name: http
              containerPort: 8081
          # Container-level securityContext: PSS "restricted" in full.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          # ozzd has no HTTP health endpoint yet, so we use TCP-socket probes:
          # they only confirm the listener is accepting connections, not that the
          # app is healthy. A real /healthz (+ /readyz) is a follow-up; swap to
          # httpGet probes once it lands. See deploy/README.md.
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
