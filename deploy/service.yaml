# Service exposing ozzd's gRPC and HTTP/SSE ports inside the cluster.
#
# ClusterIP only — the ozzd API is UNAUTHENTICATED, so it must not be exposed
# beyond a trusted network. Do NOT switch this to LoadBalancer/NodePort without
# an external auth boundary in front. See deploy/README.md.
apiVersion: v1
kind: Service
metadata:
  name: ozzd
  labels:
    app.kubernetes.io/name: ozzharness
    app.kubernetes.io/component: ozzd
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ozzharness
    app.kubernetes.io/component: ozzd
  ports:
    - name: grpc
      port: 8080
      targetPort: grpc
    - name: http
      port: 8081
      targetPort: http
