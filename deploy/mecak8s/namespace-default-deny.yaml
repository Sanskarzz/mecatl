# Namespace-level default-deny NetworkPolicy (ADR 0048, mecak8s posture).
#
# This is the posture-level default-deny: it selects ALL pods in the mecatl
# namespace and denies all ingress + egress by default. The two workload-
# specific policies — `networkpolicy.yaml` (the agent's explicit egress allows)
# and `redis-networkpolicy.yaml` (Redis's agent-only ingress allow) — are the
# ADDITIVE allows on top of this default-deny. Together they enforce
# defense-in-depth (Google Cloud principle #4): a future unlabeled pod in the
# namespace has NO ingress + NO egress until an explicit policy allows it,
# rather than unrestricted connectivity by default.
#
# Listed FIRST in kustomization.yaml so the posture is clear: the default-deny
# baseline, then the workload allows layer on top.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: namespace-default-deny
  namespace: mecatl
  labels:
    app.kubernetes.io/name: mecatl
    app.kubernetes.io/part-of: mecak8s
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
