# Kustomize base for mecak8s (ADR 0048).
#
# Applies the full cloud-native topology: namespace (PSS restricted), Redis
# StatefulSet + Service (the managed stateful backing service), the agent
# Deployment + Service (storage-free), RBAC (lease verbs), PDB, and a
# default-deny + explicit-egress NetworkPolicy.
#
# The agent image is the ko placeholder `ko://...`; `ko resolve -f deploy/mecak8s/`
# substitutes it with the built image ref. The Redis image is pulled from Docker Hub.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - rbac.yaml
  - redis-statefulset.yaml
  - redis-service.yaml
  - redis-networkpolicy.yaml
  - agent-deployment.yaml
  - agent-service.yaml
  - pdb.yaml
  - networkpolicy.yaml
