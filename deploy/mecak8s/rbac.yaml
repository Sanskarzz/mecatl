# RBAC for the mecak8s agent: it holds coordination.k8s.io Leases per session
# (the cross-process single-writer enforcement, ADR 0027 Phase 4) via the
# in-cluster ServiceAccount token. The k8slease adapter ONLY ever calls
# Get/Create/Update/Delete (never List or Watch — see
# internal/adapter/k8slease/k8slease.go), so the Role grants exactly those
# verbs on `leases` in this namespace. Namespace-scoped (a Role + RoleBinding,
# never a ClusterRole): the agent never touches leases outside mecatl.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mecak8s-agent
  namespace: mecatl
  labels:
    app.kubernetes.io/name: mecatl
    app.kubernetes.io/part-of: mecak8s
    app.kubernetes.io/component: agent
automountServiceAccountToken: true  # the agent needs the token to talk to the API server for leases
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mecak8s-agent-lease-holder
  namespace: mecatl
  labels:
    app.kubernetes.io/name: mecatl
    app.kubernetes.io/part-of: mecak8s
    app.kubernetes.io/component: agent
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    # Exactly the verbs the k8slease adapter calls — get/create/update/delete,
    # NEVER list/watch. Least privilege.
    verbs: ["get", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mecak8s-agent-lease-holder
  namespace: mecatl
  labels:
    app.kubernetes.io/name: mecatl
    app.kubernetes.io/part-of: mecak8s
    app.kubernetes.io/component: agent
subjects:
  - kind: ServiceAccount
    name: mecak8s-agent
    namespace: mecatl
roleRef:
  kind: Role
  name: mecak8s-agent-lease-holder
  apiGroup: rbac.authorization.k8s.io
