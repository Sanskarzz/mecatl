# mecak8s agent Service — the stable front door for gRPC + HTTP/SSE clients.
apiVersion: v1
kind: Service
metadata:
  name: mecak8s-agent
  namespace: mecatl
  labels:
    app.kubernetes.io/name: mecatl
    app.kubernetes.io/part-of: mecak8s
    app.kubernetes.io/component: agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mecatl
    app.kubernetes.io/part-of: mecak8s
    app.kubernetes.io/component: agent
  ports:
    - name: grpc
      port: 8080
      targetPort: grpc
    - name: http
      port: 8081
      targetPort: http
