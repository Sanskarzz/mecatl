# PodDisruptionBudget for the mecak8s agent — keep at least one replica
# available during voluntary disruptions (node drains, cluster autoscaler).
# minAvailable:1 ensures a rolling node maintenance never takes both replicas
# down, so the lease + Redis state survives and at least one pod can serve.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mecak8s-agent
  namespace: mecatl
  labels:
    app.kubernetes.io/name: mecatl
    app.kubernetes.io/part-of: mecak8s
    app.kubernetes.io/component: agent
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mecatl
      app.kubernetes.io/part-of: mecak8s
      app.kubernetes.io/component: agent
