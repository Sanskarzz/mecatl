# Redis — the managed stateful backing service for mecak8s (ADR 0048).
#
# The agent pods are STORAGE-FREE: every piece of durable state (session
# snapshots, the durable event log, session retention) lives in Redis as a
# managed service. This is the 12-factor Factor VI posture ("any state in a
# stateful backing service") and the managed-service posture (Google Cloud
# principle #3): we deploy a STANDARD Redis image, NOT a custom store binary.
# For production, swap this StatefulSet for a managed Redis (ElastiCache /
# MemoryStore / Upstash) — the adapter (internal/adapter/redisstore) is
# transport-only and does not change.
#
# Redis owns its own PVC (replicas:1, RWO) — that is its job as the stateful
# backing service. Nothing ELSE mecatl owns has a PVC. Redis's persistence
# config (RDB default / AOF for the EventLog durability contract) determines
# durability-on-crash; the adapter calls RPUSH/HSET synchronously.
#
# PSS-RESTRICTED NOTE (risk #6 in MECAK8S-PLAN): the redis:7-alpine image runs
# as UID 999. We set runAsUser: 999 + runAsNonRoot: true so the pod complies
# with the restricted profile. If a future Redis image changes its UID, update
# this to match or use a distroless Redis image.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: mecatl
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: mecak8s
    app.kubernetes.io/component: store
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/part-of: mecak8s
      app.kubernetes.io/component: store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: mecak8s
        app.kubernetes.io/component: store
    spec:
      # Redis is a stateful backing service, NOT an agent: it never talks to
      # the k8s API, so it does not need a mounted ServiceAccount token.
      automountServiceAccountToken: false
      securityContext:
        # PSS restricted: redis:7-alpine runs as UID 999.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - --appendonly
            - "yes"  # AOF: the EventLog durability contract (risk #7)
            - --dir
            - /data  # self-documenting + independent of the image's default dir
            - --appenddirname
            - appendonlydir  # the AOF subdir; independent of image defaults
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # startupProbe gates liveness until Redis is actually up: with AOF
          # replay (--appendonly yes) on a cold PVC, Redis can take longer than
          # a liveness initialDelay to accept connections; without a startup
          # probe kubelet kills it → CrashLoopBackOff during AOF replay.
          startupProbe:
            exec:
              command: ["redis-cli", "-h", "127.0.0.1", "ping"]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["redis-cli", "-h", "127.0.0.1", "ping"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "-h", "127.0.0.1", "ping"]
            periodSeconds: 20
          volumeMounts:
            # Redis's data dir — the one PVC in the whole deployment. AOF + RDB
            # snapshots live here. readOnlyRootFilesystem forces this explicit mount.
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
