# NetworkPolicy for the Redis store — default-deny ingress, allow ONLY the
# mecak8s agent.
#
# The agent egress NetworkPolicy already scopes the agent→Redis connection, but
# a NetworkPolicy selecting the AGENT scopes only the agent's egress — it does
# NOT restrict who can connect TO Redis. Without this policy, any pod in the
# namespace (or any pod that can route to it, depending on the CNI default)
# could connect to Redis on 6379. Redis holds every session snapshot, the
# durable event log, and the tool-call audit log, so its ingress must be
# restricted to the agent pods only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-default-deny-ingress
  namespace: mecatl
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: mecak8s
    app.kubernetes.io/component: store
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/part-of: mecak8s
      app.kubernetes.io/component: store
  policyTypes:
    - Ingress
  ingress:
    # Allow ONLY the mecak8s agent pods, on the Redis port. The explicit
    # namespaceSelector makes the policy self-documenting and correct even if
    # copied to a cross-namespace topology (a podSelector-only `from` is
    # same-namespace-today but silently breaks if the agent moves namespaces).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mecatl
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mecatl
              app.kubernetes.io/part-of: mecak8s
              app.kubernetes.io/component: agent
      ports:
        - protocol: TCP
          port: 6379
