# Namespace for the mecak8s cloud-native deployment (ADR 0048).
#
# The mecatl namespace holds the storage-free agent Deployment, the Redis
# StatefulSet (the managed stateful backing service), and the RBAC the agent
# needs to hold coordination.k8s.io Leases. PSS restricted is enforced at the
# pod level on every workload below.
apiVersion: v1
kind: Namespace
metadata:
  name: mecatl
  labels:
    app.kubernetes.io/name: mecatl
    app.kubernetes.io/part-of: mecak8s
    # pod-security.kubernetes.io/enforce=restricted makes the API server REJECT
    # a pod that violates the restricted profile (defense-in-depth; the pod
    # specs below already comply).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
