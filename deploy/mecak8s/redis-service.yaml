# Redis Service — the stable DNS name the agent pods connect to.
# The agent args reference this as --redis-url=redis:6379.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: mecatl
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: mecak8s
    app.kubernetes.io/component: store
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: mecak8s
    app.kubernetes.io/component: store
  ports:
    - name: redis
      port: 6379
      targetPort: redis
