version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/stacklok/mecatl/contracts/gen/go
  # protovalidate publishes its own canonical Go module path; managed-mode
  # go_package rewriting would clobber it. Keep managed mode on for our protos
  # and off for the protovalidate module.
  disable:
    - module: buf.build/bufbuild/protovalidate
      file_option: go_package_prefix
plugins:
  # Standard protocolbuffers/go output is enough: protovalidate annotations
  # are read from message descriptors at runtime, so no validate-go codegen
  # plugin is required. Versions mirror the downstream consumer's house setup.
  - remote: buf.build/protocolbuffers/go:v1.36.4
    out: contracts/gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: contracts/gen/go
    opt:
      - paths=source_relative
      - require_unimplemented_servers=true
