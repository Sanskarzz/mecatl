# Taskfile for ozzharness (https://taskfile.dev).
#
# Required tools (assumed on PATH; install commands below):
#   - go            >= 1.26.3   (the toolchain)
#   - golangci-lint >= 2.x      https://golangci-lint.run/welcome/install/
#                               go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
#   - goimports     (only for `task fmt`)
#                               go install golang.org/x/tools/cmd/goimports@latest
#   - buf           (only for `task generate`, once proto contracts land — WP10)
#                               https://buf.build/docs/installation
#
# golangci-lint is invoked with --allow-parallel-runners everywhere so several
# work packages can lint the same checkout concurrently without clobbering each
# other's run lock.
version: '3'

vars:
  PKG: github.com/stacklok/ozzharness

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Compile binaries into bin/
    cmds:
      - go build -o bin/ozzd ./cmd/ozzd
      - go build -o bin/ozzdemo ./cmd/ozzdemo

  clean:
    desc: Remove the bin/ build output directory
    cmds:
      - rm -rf bin/

  test:
    desc: Run unit tests with the race detector
    cmds:
      - go test -race ./...

  test:cover:
    desc: Run tests with coverage and write coverage/coverage.{out,html}
    cmds:
      - mkdir -p coverage
      - go test -race -coverprofile=coverage/coverage.out -covermode=atomic ./...
      - go tool cover -func=coverage/coverage.out
      - go tool cover -html=coverage/coverage.out -o coverage/coverage.html
      - 'echo "HTML coverage report: coverage/coverage.html"'

  lint:
    desc: Run golangci-lint (parallel-safe) and go vet
    cmds:
      - golangci-lint run --allow-parallel-runners ./...
      - go vet ./...

  lint:fix:
    desc: Run golangci-lint with autofix (parallel-safe)
    cmds:
      - golangci-lint run --allow-parallel-runners --fix ./...

  fmt:
    desc: Format Go code (gofmt + goimports if available)
    cmds:
      - gofmt -w .
      - cmd: command -v goimports >/dev/null 2>&1 && goimports -w -local {{.PKG}} . || echo "goimports not found; skipping (install:go install golang.org/x/tools/cmd/goimports@latest)"
        silent: true

  fmt:check:
    desc: Fail if any Go file is not gofmt-clean
    cmds:
      - cmd: test -z "$(gofmt -l .)" || { echo "gofmt needs to run on:"; gofmt -l .; exit 1; }

  tidy:
    desc: Tidy go.mod / go.sum
    cmds:
      - go mod tidy

  generate:
    desc: Run buf code generation (no-op until proto contracts exist — WP10)
    cmds:
      # buf generation is gated on the proto contracts that WP10 will add.
      # Until buf.gen.yaml and the contracts/proto tree exist this is a
      # deliberate no-op so `task ci` works on the current checkout. The buf
      # invocation mirrors the downstream consumer's house setup (buf generate against the
      # repo-root buf.gen.yaml writing into contracts/gen).
      - cmd: |
          if [ -f buf.gen.yaml ] && [ -d contracts/proto ]; then
            command -v buf >/dev/null 2>&1 || { echo "buf not found; install: https://buf.build/docs/installation"; exit 1; }
            buf generate
          else
            echo "skip generate: buf.gen.yaml and/or contracts/proto not present yet (WP10)"
          fi
        silent: true

  ci:
    desc: Full local CI gate (tidy, fmt, lint, test, build)
    cmds:
      - task: tidy
      - task: fmt
      - task: lint
      - task: test
      - task: build

  all:
    desc: Alias for the ci task
    cmds:
      - task: ci
