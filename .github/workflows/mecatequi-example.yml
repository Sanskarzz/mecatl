# ════════════════════════════════════════════════════════════════════════════════════
# EXAMPLE / TEMPLATE — copy into your repo and review; this repo does not run it against
# real issues. There is NO 'mecatequi' label and no secret configured in this repo, so
# this file is inert here. It is the canonical SPLIT-PRIVILEGE two-job pattern for running
# mecatequi from GitHub Actions safely. Read docs/design/MECATEQUI.md before enabling it.
# ════════════════════════════════════════════════════════════════════════════════════
#
# THE TOKEN BOUNDARY INVARIANT (the whole point):
#   - The `implement` job RUNS THE AGENT but holds NO GitHub write token (contents: read,
#     no id-token, no write). Its only secret is the LLM key. If the agent is hijacked by
#     a prompt-injection in untrusted issue text, the blast radius is the rotatable LLM
#     key — it cannot push code, open PRs, or comment.
#   - The `publish` job HOLDS THE WRITE TOKEN but RUNS NO AGENT CODE. It only applies the
#     produced patch as DATA (git apply) and posts the summary as text.
# The step that can write to GitHub never runs agent code; the step that runs agent code
# never holds a write token.
#
# INJECTION SAFETY: untrusted issue text never appears in a ${{ }} interpolation inside a
# run: body or as an argv token. extract-prompt.sh reads $GITHUB_EVENT_PATH with jq into a
# file; the file reaches the binary via --prompt-file; the binary fences it. Every event-
# derived value (author_association, issue number, paths) crosses via env:, never inline.

name: mecatequi (EXAMPLE)

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

# Least-privilege workflow default. Jobs opt UP only where they must.
permissions:
  contents: read

# Never run two mecatequi runs for the same issue at once. Fall back to run_id for any
# non-issue event so distinct events never collapse into one group.
concurrency:
  group: mecatequi-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  # ── acknowledge: post an EARLY issue-side trace, FIRST, before any agent runs ──────────
  # Runs first, gated on the SAME trigger as `implement`, holds ONLY issues:write (no LLM
  # key, no agent code), and posts a durable "working on it" comment with the run URL. This
  # guarantees the issue author always gets an issue-side trace + a link to the run, even if
  # everything downstream (the agent, publish) fails silently.
  acknowledge:
    name: Acknowledge (early issue comment, no agent code)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Same gate as `implement` (kept in lockstep — both must match for a run to start).
    if: >-
      (
        github.event_name == 'issues' &&
        github.event.label.name == 'mecatequi' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request == null &&
        contains(github.event.comment.body, '@mecatequi') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    # Only issues:write. No contents write, no id-token, no LLM key — runs no agent code.
    permissions:
      issues: write
    steps:
      - name: Post acknowledgement comment
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # The body is a fixed string + the run URL (a github-context value, not event text),
        # passed via env and --body — never an inline interpolation of untrusted issue text.
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPO}" \
            --body "🤖 mecatequi is working on this — see the run: ${RUN_URL}"

  implement:
    name: Run mecatequi (agent, no write token)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Run after `acknowledge` so the issue always carries an early trace before the agent
    # starts. `needs: acknowledge` skips implement whenever the gate did not match; the
    # `needs.acknowledge.result == 'success'` clause keeps it from running if acknowledge
    # itself failed. The trigger + author-association conditions are RESTATED here as
    # defense-in-depth. author-gate.sh re-asserts the association inside the job.
    #
    # Gate on the trigger AND the author association. The label path requires the
    # 'mecatequi' label; the comment path requires a '@mecatequi' mention AND that the
    # comment is on an ISSUE, not a PR (issue_comment fires on PR comments too, where the
    # "issue" is the PR — running the agent against PR text with a nonsensical
    # `Closes #<PR>` is wrong). Either way the actor must be OWNER/MEMBER/COLLABORATOR — a
    # drive-by issue from a random account never starts the job.
    needs: acknowledge
    if: >-
      needs.acknowledge.result == 'success' && (
        (
          github.event_name == 'issues' &&
          github.event.label.name == 'mecatequi' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
        ) || (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request == null &&
          contains(github.event.comment.body, '@mecatequi') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        )
      )
    # NO write, NO id-token. The only secret is the LLM key, injected at JOB level below.
    permissions:
      contents: read
    # The LLM key MUST be delivered at JOB level, not on the `uses:` step that invokes the
    # composite action. STEP-LEVEL `env:` set on a `uses:` step does NOT propagate into a
    # composite action's internal steps, but JOB-level env (the shared $GITHUB_ENV store)
    # does — and the composite reads the key from the process environment, never an input.
    # Scoped to THIS (implement) job ONLY — the publish job must never see the LLM key.
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      # Pin to the IMMUTABLE event SHA so the tree the agent diffs against is exactly the
      # tree `publish` later applies the patch onto — the default branch tip can move
      # between the two jobs (especially on issue_comment), which would apply the patch to
      # the wrong tree.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # Defense-in-depth behind the job `if:`. The association crosses via env, never argv.
      - name: Author gate
        shell: bash
        env:
          ASSOC: ${{ github.event_name == 'issue_comment' && github.event.comment.author_association || github.event.issue.author_association }}
        run: ./.github/actions/mecatequi/author-gate.sh

      # Extract the UNTRUSTED prompt from the event JSON into a file via jq — never an
      # inline ${{ }} of the body. The file path is the script's $1.
      - name: Extract prompt
        shell: bash
        run: ./.github/actions/mecatequi/extract-prompt.sh "${RUNNER_TEMP}/prompt.txt"

      # The LLM key reaches the binary via the JOB-level env: block above, NOT a step env
      # here — step-level env on a `uses:` step does not propagate into the composite
      # action's internal steps, and the binary reads the key from the process environment.
      - name: mecatequi
        id: mecatequi
        uses: ./.github/actions/mecatequi
        with:
          prompt-file: ${{ runner.temp }}/prompt.txt
          untrusted: "true"
          posture: "auto"

      - name: Upload run artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mecatequi-run
          # Read every path from the action's outputs (including events-path) so an
          # out-events override is never silently missed.
          path: |
            ${{ steps.mecatequi.outputs.patch-path }}
            ${{ steps.mecatequi.outputs.summary-path }}
            ${{ steps.mecatequi.outputs.events-path }}
          if-no-files-found: warn
          retention-days: 7

    outputs:
      stop-reason: ${{ steps.mecatequi.outputs.stop-reason }}
      non-empty-diff: ${{ steps.mecatequi.outputs.non-empty-diff }}
      exit-class: ${{ steps.mecatequi.outputs.exit-class }}

  publish:
    name: Publish result (write token, no agent code)
    needs: [acknowledge, implement]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Run whenever the gate matched (acknowledge succeeded) and the run was not cancelled —
    # on implement SUCCESS *and* on implement FAILURE — so the operator always gets a
    # terminal result (an honest failure comment, never silence). A non-matching trigger
    # (acknowledge skipped) skips publish too; an implement failure still lands here and
    # publish.sh reads the empty/failed EXIT_CLASS as setup-failure and comments.
    if: ${{ !cancelled() && needs.acknowledge.result == 'success' }}
    # The privileged job. It applies the patch as DATA and posts text — it never runs
    # agent output as code.
    #
    # SECURITY: this job holds a STANDING write grant via the broad GITHUB_TOKEN below. The
    # STRONGER posture is to mint a short-lived GitHub App installation token (a JIT token
    # scoped to exactly this repo's contents + pull-requests + issues) and pass it as
    # GH_TOKEN instead, removing the standing grant. Decide this where you edit these perms.
    # See docs/design/MECATEQUI.md.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # Pin to the SAME immutable SHA `implement` diffed against (see that job's checkout)
      # so the patch applies onto the matching tree. persist-credentials:false keeps the
      # checkout token off disk — publish.sh pushes via the explicit GH_TOKEN env, not the
      # on-disk credential.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # NON-FATAL on purpose: when `implement` failed before its upload-artifact step, the
      # 'mecatequi-run' artifact does not exist and download-artifact would otherwise HARD-
      # ABORT this job — the silent-failure case. continue-on-error lets publish.sh run
      # regardless: a missing artifact leaves PATCH_PATH/SUMMARY_PATH absent and EXIT_CLASS
      # empty, which the script reads as setup-failure and comments.
      - name: Download run artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          name: mecatequi-run
          path: ${{ runner.temp }}/mecatequi-run

      # All values cross via env: — never an inline interpolation that the shell would
      # splice. publish.sh applies the patch as DATA (git apply) and never executes agent
      # output. An empty EXIT_CLASS (e.g. implement died before setting its output, or the
      # artifact was missing) is treated as a setup-failure by the script, so a failure
      # still posts a comment.
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PATCH_PATH: ${{ runner.temp }}/mecatequi-run/mecatequi.patch
          SUMMARY_PATH: ${{ runner.temp }}/mecatequi-run/mecatequi.summary.json
          EXIT_CLASS: ${{ needs.implement.outputs.exit-class }}
          REPO: ${{ github.repository }}
          # Optional: pin the PR base branch. Defaults to the repo default branch when unset.
          # BASE_BRANCH: main
          # Optional: custom PR-description / PR-title templates (paths relative to the
          # checkout) with {{placeholder}} tokens. Unset = the built-in rich body; publish.sh
          # also auto-uses .github/mecatequi/pr-body.md if present (rename the shipped
          # .github/mecatequi/pr-body.md.example to activate it). The trust caveat is ALWAYS
          # force-prepended regardless of template. See docs/design/MECATEQUI.md.
          # MQ_PR_BODY_TEMPLATE: .github/mecatequi/pr-body.md
          # MQ_PR_TITLE_TEMPLATE: .github/mecatequi/pr-title.txt
        run: ./.github/actions/mecatequi/publish.sh
