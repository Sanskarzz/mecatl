# Release pipeline for ozzharness — builds, publishes, signs, and attests the
# ozzd container image on every `v*` tag push.
#
# Supply-chain properties this workflow gives a consumer:
#   1. Image built reproducibly from source with ko (no Dockerfile) onto the
#      digest-pinned distroless base in .ko.yaml.
#   2. Pushed to GHCR using the workflow's GITHUB_TOKEN — no static registry
#      credentials live in repo secrets.
#   3. Keyless-signed with cosign + Sigstore (Fulcio/Rekor): the signing
#      "identity" is this workflow's OIDC token, recorded in the public
#      transparency log. No long-lived signing keys to manage or leak.
#   4. SBOM (SPDX) generated and pushed alongside the image, then attached as a
#      signed cosign attestation so consumers can verify provenance of contents.
#
# Verification by a consumer is documented in .github/workflows/README.md.
#
# Trigger is `push: tags: v*` only — release artifacts come from immutable tags,
# never from branch state. No `pull_request_target` anywhere; nothing here runs
# untrusted code.
name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual re-run hook for re-publishing a tag's artifacts (e.g. after a
  # transient registry failure). Re-running re-signs idempotently.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to (re)publish'
        required: true
        type: string

# Least-privilege default. Only the publish job elevates, and only to exactly
# what ko-push + cosign-keyless need.
permissions:
  contents: read

# Never run two releases for the same tag concurrently. Do NOT cancel in
# progress — a half-signed release is worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  publish:
    name: Build, publish, sign, attest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # checkout
      packages: write # push image + SBOM to GHCR
      id-token: write # OIDC: ghcr login AND cosign keyless signing
    env:
      # ghcr.io/<owner>/<repo>, lowercased by GHCR. ko appends the binary import
      # path unless --bare is used (we use --bare, matching the Taskfile).
      KO_DOCKER_REPO: ghcr.io/${{ github.repository }}
      # On workflow_dispatch github.ref_name is the default branch, so prefer
      # the explicit input; on a tag push github.ref_name is the tag.
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # ko reads the base image digest from .ko.yaml; no deep history needed.
          fetch-depth: 1
          ref: ${{ env.VERSION }}

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: ko-build/setup-ko@d006021bd0c28d1ce33a07e7943d48b079944c8d # v0.9
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # OIDC-backed registry login. The GITHUB_TOKEN is scoped to this repo's
      # packages by the job `permissions.packages: write` above — no PAT, no
      # username/password stored in secrets.
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ko login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Build multi-arch, push by digest, and have ko generate + push an SPDX
      # SBOM next to the image. --bare keeps the repo path clean (no import-path
      # suffix), matching `task ko:publish`. We tag both the version and latest.
      # The digest is captured for signing so we sign the immutable artifact,
      # not a mutable tag.
      - name: Build and push image (+ SBOM)
        id: build
        run: |
          set -euo pipefail
          # --image-refs writes the fully-qualified pushed refs (one per line,
          # including the @sha256 digest) to a file; ko's build logs go to
          # stderr, so reading the file avoids any log interleaving.
          KO_DOCKER_REPO="${KO_DOCKER_REPO}" ko build \
            --platform=linux/amd64,linux/arm64 \
            --bare \
            --sbom=spdx \
            -t "${VERSION}" -t latest \
            --image-refs=image-refs.txt \
            --image-label=org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --image-label=org.opencontainers.image.title=ozzd \
            --image-label=org.opencontainers.image.revision=${{ github.sha }} \
            --image-label=org.opencontainers.image.vendor=Stacklok \
            ./cmd/ozzd
          # The digest ref is the same image regardless of tag; take the first.
          digest="$(head -n1 image-refs.txt)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Built ${digest}"

      # Keyless sign the image BY DIGEST. --yes skips the confirmation prompt;
      # the OIDC identity (this workflow) is logged to Rekor automatically.
      - name: Sign image (keyless)
        env:
          IMAGE: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}"

      # ko already pushed the SBOM as an OCI artifact; additionally attach it as
      # a signed cosign attestation so it is covered by the same Sigstore
      # transparency guarantees as the signature.
      - name: Generate SBOM file
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          # SBOM is attested below; don't also publish it as a release asset.
          upload-artifact: false

      - name: Attest SBOM (keyless)
        env:
          IMAGE: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${IMAGE}"

      # ---------------------------------------------------------------------
      # SLSA provenance — documented follow-up.
      #
      # The baseline above (keyless signature + signed SBOM attestation) gives
      # consumers verifiable origin and contents. Full SLSA Build L3 provenance
      # is the documented next step: it requires the
      # slsa-framework/slsa-github-generator container-generator reusable
      # workflow, run as a SEPARATE job that takes ${{ steps.build.outputs.digest }}
      # as input and pushes a provenance attestation. It is intentionally left
      # out of this first cut because it is a heavier, separately-versioned
      # reusable workflow with its own permission/secrets contract; wiring it in
      # cleanly (and verifying the resulting attestation end-to-end) is its own
      # change. See https://slsa.dev/ and
      # https://github.com/slsa-framework/slsa-github-generator/blob/main/internal/builders/container/README.md
      # ---------------------------------------------------------------------
